[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "software-planner"
version = "0.1.0"
description = "A FastAPI-based software planning service with a modular, extensible architecture"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.git
  | \.venv
  | venv
  | env
  | __pycache__
  | \.pytest_cache
  | \.mypy_cache
  | migrations
  | dist
  | build
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true
known_first_party = ["app", "tests"]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip = ["migrations", ".venv", "venv", "env", "__pycache__", ".pytest_cache", ".mypy_cache"]

[tool.mypy]
python_version = "3.10"
# Lenient settings - gradually tighten as codebase improves
warn_return_any = false
warn_unused_configs = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
disallow_untyped_decorators = false
no_implicit_optional = false
warn_redundant_casts = false
warn_unused_ignores = false
warn_no_return = false
warn_unreachable = false
strict_equality = false
# Display settings
pretty = true
show_error_codes = true
show_error_context = false
show_column_numbers = false
# Ignore all missing imports to avoid third-party stub issues
ignore_missing_imports = true
# Skip type checking for problematic patterns
allow_redefinition = true
allow_untyped_globals = true
allow_untyped_defs = true
allow_incomplete_defs = true

# Paths to check
files = ["app", "tests"]

# Exclude patterns
exclude = [
    "migrations/",
    "venv/",
    ".venv/",
    "env/",
    "__pycache__/",
]

# Per-module options for third-party libraries with missing stubs
[[tool.mypy.overrides]]
module = [
    "anthropic.*",
    "google.genai.*",
    "openai.*",
    "uvicorn.*",
    "prometheus_client.*",
    "asyncpg.*",
    "alembic.*",
]
ignore_missing_imports = true
ignore_errors = true

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]

[tool.coverage.run]
source = ["app"]
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
